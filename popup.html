<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chrome Proxy</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="dist/popup.js"></script>
  </head>
  <body class="popup">
    <main class="popup-shell" aria-busy="true" id="app">
      <header class="popup-header">
        <div class="brand"><img src="icons/icon-32.png" width="24" height="24" alt="" /><h1>Chrome Proxy</h1></div>
        <button id="settings" class="text-button" type="button">Настройки ↗</button>
      </header>
      <fieldset class="mode-picker" id="mode-picker" disabled>
        <legend class="visually-hidden">Как подключаться в этом профиле</legend>
        <label><input type="radio" name="mode" value="auto" /><span>Авто</span></label>
        <label><input type="radio" name="mode" value="direct" /><span>Напрямую</span></label>
        <label><input type="radio" name="mode" value="system" /><span>Как в macOS</span></label>
      </fieldset>
      <p id="mode-description" class="mode-description">Загружаю настройки…</p>
      <section class="current-site" aria-labelledby="site-heading">
        <h2 id="site-heading" class="eyebrow">Текущий сайт</h2>
        <p id="hostname" class="hostname">Проверяю вкладку…</p>
        <div class="route-row"><span id="route" class="route-label">—</span><span id="reason" class="muted"></span></div>
        <button id="site-action" class="button secondary full-width" type="button" disabled>Открывать напрямую</button>
      </section>
      <p id="error" class="feedback error" role="alert" hidden></p>
      <button id="retry" class="button secondary full-width" type="button" hidden>Повторить</button>
      <p id="notice" class="feedback" role="status" hidden></p>
      <footer class="popup-footer"><button id="exceptions" class="text-button" type="button" disabled>Сайты напрямую</button><span id="control" class="muted">Только этот профиль</span></footer>
    </main>
  </body>
</html>
